[package]
name = "extraction"
version = "0.1.0"
edition = "2024"
description = "Verified local Melee ISO discovery, extraction, and asset bundles"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
