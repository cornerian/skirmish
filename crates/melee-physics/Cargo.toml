[package]
name = "melee-physics"
version = "0.1.0"
edition = "2024"
description = "Exact scalar movement helpers from doldecomp/melee, independent of rendering"
publish = false

[dependencies]
libm = "0.2"
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
