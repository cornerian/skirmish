[package]
name = "skirmish-script-runtime"
version = "0.1.0"
edition = "2024"
description = "Native script boundary and Pon gameplay runtime"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
skirmish-pon-runtime = { path = "../pon-runtime" }

[features]
default = []
experimental-continuations = ["skirmish-pon-runtime/experimental-continuations"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
