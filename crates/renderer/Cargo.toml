[package]
name = "renderer"
version = "0.1.0"
edition = "2024"
description = "Native rendering and audio presentation for Skirmish"
publish = false

[[bin]]
name = "skirmish-renderer"
path = "src/main.rs"

[dependencies]
extraction = { path = "../extraction" }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
cpal = "0.18.2"
rtrb = "0.4"
glam = "0.33.7"
png = "0.18.1"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30.0.1"
sdl3 = { version = "0.20", features = ["raw-window-handle"] }
skirmish = { path = "../..", features = ["controller-input"] }
menus = { path = "../menus" }
font8x8 = "0.3"

[build-dependencies]
wesl = { version = "0.4.4", default-features = false }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
