[package]
name = "arena"
version = "0.1.0"
edition = "2024"
description = "Experimental deterministic headless match orchestration for Skirmish"
publish = false

[dependencies]
physics = { path = "../physics", features = ["serde"] }
replay = { path = "../replay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
libm = "0.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
