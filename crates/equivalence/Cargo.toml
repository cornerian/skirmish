[package]
name = "skirmish-equivalence"
version = "0.1.0"
edition = "2024"
description = "Semantic trace and executable equivalence tools for Skirmish"
publish = false

[[bin]]
name = "skirmish-probe"
path = "src/bin/skirmish-probe.rs"

[features]
default = []
c-oracle = []

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
skirmish = { path = "../.." }
wait-timeout = "0.2"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
