[package]
name = "peppi-adapter"
version = "0.1.0"
edition = "2024"
description = "Peppi-backed Slippi replay observations for native Skirmish validation"
publish = false

[dependencies]
peppi = "=2.1.2"
replay = { path = "../replay" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
