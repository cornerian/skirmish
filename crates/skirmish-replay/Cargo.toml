[package]
name = "skirmish-replay"
version = "0.1.0"
edition = "2024"
description = "Slippi replay integration for native Skirmish validation"
publish = false

[dependencies]
anyhow = "1"
peppi-adapter = { path = "../peppi-adapter" }
replay-validation = { path = "../replay-validation" }
serde = { version = "1", features = ["derive"] }
skirmish = { path = "../.." }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
