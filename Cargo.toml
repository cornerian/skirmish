[package]
name = "skirmish"
version = "0.2.0"
edition = "2024"
description = "An incremental, behavior-tested Rust port of doldecomp/melee"
publish = false

[workspace]
members = ["crates/*"]
resolver = "3"

[features]
default = []
c-oracle = ["dep:cc"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
melee-runtime = { path = "crates/melee-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
wait-timeout = "0.2"

[build-dependencies]
cc = { version = "1", optional = true }

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
overflow-checks = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
