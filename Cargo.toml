[package]
name = "skirmish"
version = "0.2.0"
edition = "2024"
description = "An incremental, behavior-tested Rust port of doldecomp/melee"
publish = false

[workspace]
members = ["crates/*"]
resolver = "3"

[features]
default = []
c-oracle = ["dep:cc"]
controller-input = ["dep:sdl3"]

[dependencies]
anyhow = "1"
glam = { version = "0.33", default-features = false, features = ["scalar-math", "libm"] }
libm = "0.2"
menus = { path = "crates/menus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sdl3 = { version = "0.20", optional = true }
thiserror = "2"
tempfile = "3"

[build-dependencies]
cc = { version = "1", optional = true }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["html_reports"] }
proptest = "1"
replay-validation = { path = "crates/replay-validation" }
skirmish-equivalence = { path = "crates/equivalence" }
skirmish-replay = { path = "crates/skirmish-replay" }
tempfile = "3"

[[bench]]
name = "match_step"
harness = false

[profile.release]
overflow-checks = true

# Keep debug info in the bench profile (still opt-level 3) so `samply`/
# `flamegraph`/`perf` (when available) can symbolicate; mirror the release
# profile's `overflow-checks = true` so bench numbers reflect what an actual
# `cargo build --release` pays for the same checked arithmetic, per
# docs/performance.md.
[profile.bench]
debug = true
overflow-checks = true

[profile.dev.package.xxhash-rust]
opt-level = 3

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
