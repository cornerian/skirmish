[package]
name = "skirmish"
version = "0.2.0"
edition = "2024"
description = "An incremental, behavior-tested Rust port of doldecomp/melee"
publish = false

[workspace]
members = ["crates/*"]
resolver = "3"

[features]
default = []
c-oracle = ["dep:cc"]
controller-input = ["dep:sdl3"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
glam = { version = "0.33", default-features = false, features = ["scalar-math", "libm"] }
libm = "0.2"
menus = { path = "crates/menus" }
replay = { path = "crates/replay" }
peppi-adapter = { path = "crates/peppi-adapter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sdl3 = { version = "0.20", optional = true }
thiserror = "2"
tempfile = "3"

[build-dependencies]
cc = { version = "1", optional = true }
serde_json = "1"

[dev-dependencies]
peppi = "=2.1.2"
proptest = "1"
tempfile = "3"

[profile.release]
overflow-checks = true

[profile.dev.package.xxhash-rust]
opt-level = 3

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
