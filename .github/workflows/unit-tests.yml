name: Unit tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: /tmp/skirmish-target
      PROPTEST_RNG_SEED: "68492137"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tests
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace --lib --bins
      - run: cargo test --locked --workspace --lib --bins --features c-oracle
      - run: cargo test --locked --workspace --lib --bins --release --features c-oracle
      - run: cargo test --locked --workspace --doc
      - run: cargo test --locked --workspace --doc --features c-oracle
      - run: cargo test --locked --workspace --doc --release --features c-oracle
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
