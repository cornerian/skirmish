name: Rust behavior tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: /tmp/skirmish-target
      PROPTEST_RNG_SEED: "68492137"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --features c-oracle
      - run: cargo run --locked --bin skirmish -- demo-match > "$RUNNER_TEMP/skirmish-debug.jsonl"
      - run: cargo test --locked --workspace --release --features c-oracle
      - run: |
          cargo run --locked --release --bin skirmish -- demo-match > "$RUNNER_TEMP/skirmish-release.jsonl"
          cargo run --locked --bin skirmish -- compare-traces "$RUNNER_TEMP/skirmish-debug.jsonl" "$RUNNER_TEMP/skirmish-release.jsonl"
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
