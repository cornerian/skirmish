name: Rust behavior tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/skirmish-target
      PROPTEST_RNG_SEED: "68492137"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
      - run: cargo test --locked --workspace --features c-oracle
      - run: cargo test --locked --workspace --release --features c-oracle
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
