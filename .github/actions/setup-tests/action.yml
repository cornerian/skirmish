name: Set up Rust tests
description: Install the native workspace dependencies and Rust toolchain
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev
    - uses: libsdl-org/setup-sdl@afd98199e97f9c2aa739474be7e0886d149a5e47
      with:
        version: 3.4.16
        install-linux-dependencies: true
