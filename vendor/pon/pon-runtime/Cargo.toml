[package]
name = "pon-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"


[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
pon-gc = { git = "https://github.com/can1357/pon", rev = "ab9067dbd2899c64c4d67a4bc27b8ad49472b126" }
libc = "0.2"
num-bigint = "0.4.6"
num-integer = "0.1"
num-traits = "0.2"
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.14.0" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.14.0" }
openssl = { version = "0.10", features = ["vendored"] }
bzip2 = "0.6"
flate2 = "1"
blake2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
scrypt = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
xz2 = "0.1"
zstd = "0.13"
zip = "6"
